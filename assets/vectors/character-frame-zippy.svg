<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 612 792" width="612" height="792" role="img" aria-label="Zippy page frame — lightning motif, playful yellow">
  <title>Zippy Page Frame</title>
  <defs>
    <style>
      .wb-frame-stroke { fill: none; stroke: #FFC93C; stroke-width: 6; stroke-linecap: round; }
      .wb-bolt { fill: #FFC93C; }
      .wb-bolt-accent { fill: #FF7A6E; }
    </style>
  </defs>
  <rect x="18" y="18" width="576" height="756" rx="24" class="wb-frame-stroke"/>
  <rect x="27" y="27" width="558" height="738" rx="18" fill="none" stroke="#FFC93C" stroke-width="1.5" stroke-dasharray="10 6" stroke-linecap="round" opacity="0.6"/>

  <!-- corner lightning bolts -->
  <g transform="translate(50,50) scale(0.8)">
    <path d="M6,-16 L-6,4 L2,4 L-4,18 L14,-4 L4,-4 Z" class="wb-bolt"/>
  </g>
  <g transform="translate(562,50) scale(-0.8,0.8)">
    <path d="M6,-16 L-6,4 L2,4 L-4,18 L14,-4 L4,-4 Z" class="wb-bolt"/>
  </g>
  <g transform="translate(50,742) scale(0.8,-0.8)">
    <path d="M6,-16 L-6,4 L2,4 L-4,18 L14,-4 L4,-4 Z" class="wb-bolt"/>
  </g>
  <g transform="translate(562,742) scale(-0.8,-0.8)">
    <path d="M6,-16 L-6,4 L2,4 L-4,18 L14,-4 L4,-4 Z" class="wb-bolt"/>
  </g>

  <!-- speed streaks along the sides -->
  <g class="wb-bolt-accent" opacity="0.4">
    <rect x="24" y="380" width="26" height="5" rx="2.5"/>
    <rect x="24" y="392" width="18" height="5" rx="2.5"/>
    <rect x="562" y="380" width="26" height="5" rx="2.5"/>
    <rect x="570" y="392" width="18" height="5" rx="2.5"/>
  </g>
</svg>
