# Netlify settings for the Warehouse Ops staging demo.
# In the Netlify UI set "Base directory" to: warehouse-ops
# Netlify detects Next.js and adds its official Next.js runtime automatically.
[build]
  command = "npm run build"
  publish = ".next"
  # No custom "ignore" command: on a site's first build Netlify compares a commit with
  # itself, so a diff-based ignore rule cancels the very first deploy. With a base
  # directory set, Netlify already skips builds when nothing in this folder changed.

[build.environment]
  NODE_VERSION = "22"
